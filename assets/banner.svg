<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-label="portkill terminal demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7b72"/>
      <stop offset="1" stop-color="#ffa657"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
    .title { font-size: 34px; font-weight: 700; fill: url(#accent); }
    .sub { fill: #8b949e; font-size: 14px; }
    .dim { fill: #8b949e; }
    .cmd { fill: #e6edf3; }
    .prompt { fill: #7ee787; }
    .ok { fill: #7ee787; }
    .row { fill: #c9d1d9; }
    .line { opacity: 0; animation: show 9s infinite; }
    .l1 { animation-delay: 0.2s; }
    .l2 { animation-delay: 0.9s; }
    .l3 { animation-delay: 1.2s; }
    .l4 { animation-delay: 1.5s; }
    .l5 { animation-delay: 2.4s; }
    .l6 { animation-delay: 3.2s; }
    .cursor { fill: #e6edf3; animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 40px 40px; }
    @keyframes show {
      0%   { opacity: 0; }
      4%   { opacity: 1; }
      88%  { opacity: 1; }
      96%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  </style>
  <rect width="820" height="260" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="819" height="259" rx="14" fill="none" stroke="#30363d"/>

  <circle class="pulse" cx="40" cy="40" r="7" fill="#ff7b72"/>
  <text class="title" x="60" y="52">portkill</text>
  <text class="sub" x="60" y="76">free any port in one command</text>

  <rect x="400" y="24" width="396" height="212" rx="10" fill="#010409" stroke="#30363d"/>
  <circle cx="420" cy="42" r="5" fill="#ff5f56"/>
  <circle cx="438" cy="42" r="5" fill="#ffbd2e"/>
  <circle cx="456" cy="42" r="5" fill="#27c93f"/>

  <g class="line l1"><text x="418" y="76"><tspan class="prompt">$ </tspan><tspan class="cmd">portkill</tspan></text></g>
  <g class="line l2"><text class="dim" x="418" y="100">PORT   PID     PROCESS</text></g>
  <g class="line l3"><text class="row" x="418" y="122">3000   4821    node</text></g>
  <g class="line l4"><text class="row" x="418" y="144">8080   5190    python3</text></g>
  <g class="line l5"><text x="418" y="176"><tspan class="prompt">$ </tspan><tspan class="cmd">portkill 3000 -y</tspan></text></g>
  <g class="line l6"><text class="ok" x="418" y="200">✔ freed port 3000 (node, pid 4821)</text></g>
  <rect class="cursor" x="418" y="212" width="9" height="16"/>

  <text class="sub" x="60" y="190">Linux · macOS · Windows</text>
  <text class="sub" x="60" y="212">zero dependencies · pure Python</text>
</svg>
