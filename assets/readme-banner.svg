<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Portkill</title><desc id="d">A port activity dashboard with animated listening indicators.</desc><defs><linearGradient id="bg"><stop stop-color="#18243a"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g font-family="monospace" font-size="18"><g fill="#edf3ff"><text x="100" y="115">:3000</text><text x="100" y="165">:5173</text><text x="100" y="215">:8080</text></g><g fill="#62e3c1"><text x="280" y="115">LISTENING</text><text x="280" y="165">LISTENING</text><text x="280" y="215">AVAILABLE</text></g></g><g fill="none" stroke="#62e3c1" stroke-width="3"><circle cx="760" cy="150" r="32"/><circle cx="760" cy="150" r="58" opacity=".55"><animate attributeName="r" values="45;70;45" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="3s" repeatCount="indefinite"/></circle><circle cx="760" cy="150" r="84" opacity=".25"/></g><path d="M870 150H1040" stroke="#8fa8ff" stroke-width="3" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">PORTKILL</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">PORTS / PROCESSES / STATUS</text></svg>